<!doctype html>
<html lang="vi" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marble Luxury - Han's Studio</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,800&family=Inter:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Inter"', "sans-serif"],
              serif: ['"Playfair Display"', "serif"],
            },
            colors: {
              marbleGold: "#d4af37",
            },
          },
        },
      };
    </script>
    <style>
      body {
          background-color: #fafafa;
          background-image: url('https://images.unsplash.com/photo-1596726880092-2fe68d66cbcc?q=80&w=2500&auto=format&fit=crop'); /* Light Marble */
          background-size: cover; background-position: center; background-attachment: fixed; transition: all 0.5s;
          color: #333;
      }

      html.dark body {
          background-color: #111;
          background-image: url('https://images.unsplash.com/photo-1579273166152-d725a4e2b755?q=80&w=2500&auto=format&fit=crop'); /* Dark Marble / Black Stone */
          color: #f1f1f1;
      }

      .overlay { position: fixed; inset: 0; background: rgba(255, 255, 255, 0.4); pointer-events: none; z-index: 0; transition: all 0.5s; }
      html.dark .overlay { background: rgba(0, 0, 0, 0.7); }

      .marble-card {
          background-color: rgba(255, 255, 255, 0.95);
          border: 1px solid rgba(212, 175, 55, 0.4);
          box-shadow: 0 20px 40px -10px rgba(0,0,0,0.08), 0 10px 20px -5px rgba(212,175,55,0.08);
          border-radius: 12px; z-index: 10; relative; transition: all 0.3s;
      }

      html.dark .marble-card {
          background-color: rgba(15, 15, 15, 0.95);
          border: 1px solid rgba(212, 175, 55, 0.2);
          box-shadow: 0 20px 40px -10px rgba(0,0,0,0.8), 0 10px 20px -5px rgba(212,175,55,0.05);
      }

      .gold-border { border: 1px solid #d4af37; }
    </style>
  </head>
  <body
    class="min-h-screen w-full relative p-6 md:p-12 overflow-x-hidden flex flex-col items-center"
  >
    <div class="overlay"></div>

    <header
      class="w-full max-w-6xl z-10 flex items-center justify-between py-6 mb-12"
    >
      <h1
        class="text-3xl font-serif font-bold tracking-tight text-slate-900 dark:text-white"
      >
        <span class="text-marbleGold">Han's</span> Studio
      </h1>
      <div class="flex items-center gap-6">
        <button
          onclick="toggleMode()"
          class="w-10 h-10 rounded-full gold-border flex items-center justify-center text-marbleGold hover:bg-marbleGold hover:text-white transition-colors bg-white dark:bg-black shadow-md relative z-50"
        >
          <i data-lucide="moon" class="w-4 h-4 dark:hidden"></i>
          <i data-lucide="sun" class="w-4 h-4 hidden dark:block"></i>
        </button>
      </div>
    </header>

    <main class="w-full max-w-6xl z-10 grid grid-cols-1 lg:grid-cols-12 gap-12">
      <!-- Khối Giới Thiệu -->
      <section
        class="lg:col-span-5 flex flex-col justify-center marble-card p-12 text-slate-900 dark:text-white"
      >
        <p
          class="font-sans text-marbleGold font-semibold tracking-[0.3em] uppercase text-xs mb-6"
        >
          Biểu Tượng Đẳng Cấp
        </p>
        <h2 class="text-5xl font-serif font-black leading-[1.1] mb-8">
          Lưu Giữ <br />
          <span class="italic text-slate-500 dark:text-slate-400 font-normal"
            >Khoảnh Khắc</span
          >
          <br />
          Hoàng Gia.
        </h2>
        <button
          class="w-max bg-slate-900 dark:bg-white text-white dark:text-slate-900 font-sans text-sm tracking-widest px-10 py-4 uppercase font-medium hover:bg-marbleGold dark:hover:bg-marbleGold transition-colors"
        >
          Khám Truyền Thuyết
        </button>
      </section>

      <!-- Khối Gói Cước VIP -->
      <section class="lg:col-span-7 grid grid-cols-1 md:grid-cols-2 gap-8">
        <div
          class="marble-card p-8 flex flex-col group cursor-pointer hover:-translate-y-2 transition-transform duration-500 text-slate-900 dark:text-white"
        >
          <div
            class="w-12 h-12 rounded-full border border-marbleGold flex items-center justify-center text-marbleGold mb-6"
          >
            <i data-lucide="gem" class="w-5 h-5"></i>
          </div>
          <h3
            class="font-serif text-2xl font-bold mb-3 group-hover:text-marbleGold transition-colors"
          >
            Gói Luxury Diamond
          </h3>
          <p
            class="font-sans text-marbleGold font-semibold mb-4 tracking-widest"
          >
            120,000,000₫
          </p>
        </div>

        <!-- Gói đắt tiền -->
        <div
          class="marble-card p-8 flex flex-col bg-slate-900 dark:bg-black text-white cursor-pointer hover:-translate-y-2 transition-transform duration-500 border-none shadow-2xl"
        >
          <div
            class="w-12 h-12 rounded-full bg-marbleGold flex items-center justify-center text-white mb-6"
          >
            <i data-lucide="crown" class="w-5 h-5"></i>
          </div>
          <h3 class="font-serif text-2xl font-bold mb-3 text-white">
            Gói Royal Majestic
          </h3>
          <p
            class="font-sans text-marbleGold font-semibold mb-4 tracking-widest"
          >
            250,000,000₫
          </p>
          <div
            class="mt-auto flex items-center gap-2 text-xs font-sans uppercase tracking-widest font-semibold text-marbleGold"
          >
            <span>Book Ngay</span>
            <i data-lucide="shield-check" class="w-3 h-3 text-white"></i>
          </div>
        </div>
      </section>
    </main>

    <script>
      lucide.createIcons();
      function toggleMode() {
        document.documentElement.classList.toggle("dark");
      }
    </script>
  </body>
</html>
