<html lang="vi">
<head>
    <meta charset="UTF-8">

   <style>
    @import url('https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&display=swap');
    :root {
        --page-width: 190mm; 
        --main-padding: 8pt; 
        --dynamic-data-color: #0d6efd; 
    }
    body { font-family: 'Be Vietnam Pro', sans-serif; font-size: 8.5pt; line-height: 1.3; color: #212529; background-color: #f0f2f5; margin: 0; padding: 0; }
    
    .actions-container { 
        position: sticky; top: 0; display: flex; justify-content: flex-end; align-items: center;
        width: 100%; background-color: #343a40; padding: 8px 20px; box-sizing: border-box;
        z-index: 2000; box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    .actions-container .dropdown { position: relative; display: inline-block; }
    .actions-container .action-btn { 
        background-color: #0d6efd; color: white; border: none; padding: 8px 16px; border-radius: 5px; 
        font-size: 13px; font-weight: 500; cursor: pointer; margin-left: 10px;
    }
    .actions-container .action-btn.select-btn { background-color: #6c757d; }
    .actions-container .action-btn.download-pdf-btn { background-color: #198754; }
    .actions-container .action-btn.download-img-btn { background-color: #fd7e14; }
    
    .actions-container .dropdown-content {
        display: none; position: absolute; right: 0; background-color: #f1f1f1; min-width: 200px;
        box-shadow: 0px 8px 16px 0px rgba(0,0,0,0.2); z-index: 1; border-radius: 5px;
    }
    .actions-container .dropdown-content a {
        color: black; padding: 12px 16px; text-decoration: none; display: block; font-size: 13px;
    }
    .actions-container .dropdown-content a:hover { background-color: #ddd; }
    .actions-container .dropdown-content.show { display: block; }

    .page-wrapper { display: flex; justify-content: center; padding: 20px 0; }
    .a4-page { 
        width: var(--page-width); 
        background-color: white; 
        margin: 0 auto; 
        box-shadow: 0 0 15px rgba(0,0,0,0.1);
        box-sizing: content-box;
    }
    #print-container { width: 100%; border-collapse: collapse; table-layout: fixed; }
    #page-header, #page-footer { height: 1px; }
    .header-content, .footer-content, .main-content { padding: var(--main-padding); box-sizing: border-box; }
    .main-content { padding-top: 0; padding-bottom: 0; }
    .footer-content { 
        padding-top: 5px; 
        text-align: right; 
        font-size: 7.5pt; 
        color: #6c757d; 
        border-top: 1px solid #dee2e6;
    }
    .dynamic-data { color: var(--dynamic-data-color); font-weight: 500; }

    .header-content { padding: 12px var(--main-padding); } 
    .header-content .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #dee2e6; padding-bottom: 10px; }
    .header-left { display: flex; align-items: center; }
    
    .header-content .logo { width: 60px; height: 60px; flex-shrink: 0; }
    #contract-qr-container { width: 60px; height: 60px; flex-shrink: 0; }
    #contract-qr-container img { width: 100%; height: 100%; display: block; }
    
    .studio-info { padding-left: 12px !important; }
    .studio-info h2 { font-size: 11pt; margin: 0; } 
    .studio-info p { font-size: 8pt; line-height: 1.25; margin: 0; }

    .main-title { text-align: center; font-size: 16pt; font-weight: 700; margin: 8px 0 5px 0; text-transform: uppercase; }
    .contract-meta { text-align: center; font-style: italic; color: #555; margin-bottom: 12px; font-size: 8.5pt; }
    
    table { width: 100%; border-collapse: collapse; margin-bottom: 12px; font-size: 8.5pt; }
    th, td { border: 1px solid #dee2e6; padding: 4px 6px; text-align: left; vertical-align: top; word-break: break-word; }
    th { background-color: #e9ecef; font-weight: 700; text-align: center; }
    
    .product-cell { word-break: break-word; overflow-wrap: break-word; white-space: normal !important; }
    .price-cell { white-space: nowrap; text-align: right !important; }
    .date-cell { white-space: normal !important; word-break: break-all; }

    .summary-and-payment-wrapper { display: flex; justify-content: space-between; align-items: stretch; margin-top: 5px; margin-bottom: 15px; page-break-inside: avoid; border: 1px solid #e9ecef; padding: 12px; border-radius: 5px; }
    .left-column { width: 58%; }
    .shooting-info-table { margin-bottom: 12px; }
    .shooting-info-table td { padding: 3px 6px; }

    .qr-payment-section .qr-payment-content { display: flex; align-items: center; }
    .qr-payment-section .qr-code { width: 85px; height: 85px; flex-shrink: 0; margin-right: 12px; } 
    .qr-payment-section .qr-code img { max-width: 100%; height: auto; border: 1px solid #ccc; display: block; }
    .qr-payment-section .payment-instructions p { margin: 3px 0; font-size: 8.5pt; }

    .right-column { width: 40%; }
    .summary-table { margin-bottom: 0; }
    .summary-table td { padding: 3px 6px; }
    .summary-table .highlight-red { color: #dc3545; font-weight: 700; }
    
    .terms-section { margin-top: 12px; border-top: 1px solid #dee2e6; padding-top: 8px; }
    .print-block { page-break-inside: avoid; margin-top: 12px; }
    .print-block h3 { font-size: 9.5pt; font-weight: 700; margin: 0 0 4px 0; } 
    .print-block p, .print-block li { margin-bottom: 3px; text-align: justify; }
    .print-block ul { padding-left: 18px; list-style-type: none; margin-block-start: 0; margin-block-end: 0; }
    .print-block ul li::before { content: "- "; }
    
    .signature-block { display: flex; justify-content: space-around; text-align: center; margin-top: 25px; padding-top: 12px; border-top: 1px solid #dee2e6; page-break-before: auto; }
    .signature-block p { text-align: center; }
    .signature-block .name { margin-top: 50px; font-weight: 700; } 
    
    .manual-check-table th { text-align: center; background-color: #e9ecef; font-weight: 700; }
    .manual-check-table td { height: 20px; } 

    /* TỐI ƯU GIAO DIỆN MOBILE & TABLET (Tuyệt đối không ảnh hưởng bản in/PDF) */
    @media screen and (max-width: 768px) {
        .actions-container {
            justify-content: space-between;
            padding: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .actions-container .action-btn {
            margin-left: 0;
            flex: 1 1 calc(33.33% - 8px); 
            padding: 8px 5px;
            font-size: 11px;
            text-align: center;
        }
        .actions-container .dropdown {
            width: 100%;
            display: block;
        }
        .actions-container .dropdown .action-btn {
            width: 100%;
            margin: 0;
            font-size: 13px;
        }
        .page-wrapper {
            display: block; /* Tránh lỗi mất lề trái của flexbox khi scroll trên mobile */
            overflow-x: auto; /* Kích hoạt cuộn ngang */
            -webkit-overflow-scrolling: touch; /* Mượt mà trên iOS */
            padding: 10px;
        }
        .a4-page {
            margin: 0 auto;
            /* Width vẫn giữ nguyên var(--page-width) để đảm bảo không sai tỷ lệ khi in/xuất file */
        }
    }

    /* ĐỊNH DẠNG KHI BẤM NÚT IN */
    @media print {
        body { background: none; }
        .actions-container { display: none !important; }
        .page-wrapper { padding: 0; display: block; overflow: visible; }
        .a4-page { box-shadow: none; border: none; margin: 0; width: 100%; min-width: auto; }
        @page { size: A4; margin: 10mm; }
        #print-container { display: table; width: 100%; }
        #page-header { display: table-row-group; }
        #page-footer { display: table-footer-group; }
    }
</style>

        function readNumberInVietnamese(number) { const units=["","một","hai","ba","bốn","năm","sáu","bảy","tám","chín"],groupUnits=[""," nghìn"," triệu"," tỷ"," nghìn tỷ"," triệu tỷ"];function convertBlock(e){if("000"===e)return"";let t=parseInt(e[0]),r=parseInt(e[1]),n=parseInt(e[2]),i="";return t>0&&(i+=units[t]+" trăm"),0===r&&n>0?i+=t>0?" linh "+units[n]:units[n]:1===r?(i+=" mười",5===n?i+=" lăm":n>0&&(i+=" "+units[n])):r>1&&(i+=" "+units[r]+" mươi",1===n?i+=" mốt":5===n?i+=" lăm":n>0&&(i+=" "+units[n])),i.trim()}let numStr=String(parseInt(number,10));if("0"===numStr)return"Không đồng";let chunks=[];for(;numStr.length>0;)chunks.unshift(numStr.slice(-3)),numStr=numStr.slice(0,-3);const result=chunks.map((e,t)=>{for(;e.length<3;)e="0"+e;const r=convertBlock(e);if(!r)return"";let n=groupUnits[chunks.length-1-t];return 0===parseInt(e)&&" nghìn"===n?"":r+n}).filter(Boolean).join(" ");return(result.charAt(0).toUpperCase()+result.slice(1)).trim()+" đồng"}
        
        function formatDate(dateString) {
            if (!dateString || typeof dateString !== 'string') {
                return ''; 
            }
            const parts = dateString.split(/[\/-]/);
            if (parts.length === 3) {
                let[part1, part2, year] = parts;
                if (parseInt(part1, 10) > 12) {
                    return `${part1}/${part2}/${year}`;
                } else {
                    return `${part2}/${part1}/${year}`;
                }
            }
            return dateString;
        }

            function populateServiceTable(filterType, contractType) {
                const table = document.querySelector('.main-content table');
                if (!table) return;

                const thead = table.querySelector('thead');
                const colgroup = table.querySelector('colgroup');
                const tableBody = table.querySelector('tbody#service-table-body');
                
                tableBody.innerHTML = '';

                let dataToDisplay =[];
                
                if (contractType === 'service_2' || contractType === 'service_3') {
                     dataToDisplay = globalServiceData;
                } else if (contractType === 'family' || contractType === 'combo') {
                     dataToDisplay = globalServiceData.filter(item => item.hang_muc === 'Hợp đồng' && item.loai_dich_vu === 'Dịch vụ');
                } else if (contractType === 'dress') {
                     dataToDisplay = globalServiceData.filter(item => item.hang_muc === 'Phát sinh' || (item.hang_muc === 'Hợp đồng' && item.loai_dich_vu === 'Trang phục'));
                } else if (filterType) {
                     dataToDisplay = globalServiceData.filter(item => item.loai_dich_vu === filterType);
                } else {
                     dataToDisplay = globalServiceData;
                }

                if (contractType === 'dress') {
                    colgroup.innerHTML = `<col style="width: 4%;"><col style="width: 16%;"><col style="width: 6%;"><col style="width: 13%;"><col style="width: 13%;"><col style="width: 13%;"><col style="width: 9%;"><col style="width: 9%;"><col style="width: 17%;">`;
                    thead.innerHTML = `<tr><th>STT</th><th>Sản phẩm</th><th>Số lượng</th><th>Thành tiền</th><th>Số tiền KM</th><th>Còn lại</th><th>Ngày lấy</th><th>Ngày trả</th><th>Ghi chú</th></tr>`;
                } else {
                    colgroup.innerHTML = `<col style="width: 5%;"><col style="width: 11%;"><col style="width: 33%;"><col style="width: 8%;"><col style="width: 13%;"><col style="width: 13%;"><col style="width: 17%;">`;
                    thead.innerHTML = `<tr><th>STT</th><th>Sản phẩm</th><th>Chi tiết</th><th>Số lượng</th><th>Thành tiền</th><th>Số tiền KM</th><th>Ghi chú</th></tr>`;
                }
                 
                 dataToDisplay.forEach((item, index) => { 
                     const row = document.createElement('tr'); 
                     const thanhTienFormatted = (item.thanhtien || 0).toLocaleString('vi-VN');
                     const soTienKmFormatted = (item.sotien_km || 0).toLocaleString('vi-VN');
                     const conLaiFormatted = ((item.thanhtien || 0) - (item.sotien_km || 0)).toLocaleString('vi-VN');
                     const ghiChuFormatted = (item.ghi_chu || '').replace(/\\n/g, '<br>').replace(/\n/g, '<br>');
                     const chiTietFormatted = (item.chitiet || '').replace(/\\n/g, '<br>').replace(/\n/g, '<br>');

                     if (contractType === 'dress') {
                        const formattedNgayLay = formatDate(item.ngay_lay);
                        const formattedNgayTra = formatDate(item.ngay_tra);
                         row.innerHTML = `<td style="text-align: center;">${index + 1}</td>
                                          <td class="product-cell"><span class="dynamic-data">${item.sanpham || ''}</span></td>
                                          <td style="text-align: center;"><span class="dynamic-data">${item.soluong || 0}</span></td>
                                          <td class="price-cell"><span class="dynamic-data">${thanhTienFormatted}</span></td>
                                          <td class="price-cell"><span class="dynamic-data">${soTienKmFormatted}</span></td>
                                          <td class="price-cell"><span class="dynamic-data">${conLaiFormatted}</span></td>
                                          <td class="date-cell"><span class="dynamic-data">${formattedNgayLay}</span></td>
                                          <td class="date-cell"><span class="dynamic-data">${formattedNgayTra}</span></td>
                                          <td><span class="dynamic-data">${ghiChuFormatted}</span></td>`;
                     } else {
                         row.innerHTML = `<td style="text-align: center;">${index + 1}</td>
                                          <td class="product-cell"><span class="dynamic-data">${item.sanpham || ''}</span></td>
                                          <td><span class="dynamic-data">${chiTietFormatted}</span></td>
                                          <td style="text-align: center;"><span class="dynamic-data">${item.soluong || 0}</span></td>
                                          <td class="price-cell"><span class="dynamic-data">${thanhTienFormatted}</span></td>
                                          <td class="price-cell"><span class="dynamic-data">${soTienKmFormatted}</span></td>
                                          <td><span class="dynamic-data">${ghiChuFormatted}</span></td>`; 
                     }
                     tableBody.appendChild(row);

            function generatePaymentQRCode(data, callback){const qrContainer=document.getElementById("payment-qr-container"),bankBin=data.bin||"",accountNumber=data.accountNo||"",accountName=data.accountName||"";if(!bankBin||!accountNumber){qrContainer.innerHTML='<p style="color: red; font-size: 0.9em;">Lỗi.</p>';if(callback)callback();return}const accountNameForURL=encodeURIComponent(removeVietnameseTones(accountName).toUpperCase()),qrApiUrl=`https://img.vietqr.io/image/${bankBin}-${accountNumber}-compact.png?addInfo=${encodeURIComponent(data.info||"")}&accountName=${accountNameForURL}`,qrImage=new Image;qrImage.crossOrigin="anonymous",qrContainer.innerHTML="...",qrImage.onload=()=>{qrContainer.innerHTML="",qrContainer.appendChild(qrImage);if(callback)callback()},qrImage.onerror=()=>{qrContainer.innerHTML='<p style="color: red; font-size: 0.9em;">Lỗi QR.</p>';if(callback)callback()},qrImage.src=qrApiUrl}
            
            function generateContractQRCode(e){const t=document.getElementById("contract-qr-container");if(!t||!e)return;const r=`https://api.qrserver.com/v1/create-qr-code/?size=60x60&data=${encodeURIComponent(e)}&qzone=1&format=svg`,n=new Image;n.src=r,n.alt=`QR Code for ${e}`,t.innerHTML="",t.appendChild(n)}
            
            function getFileNamePrefix() {
                switch(currentContractType) {
                    case 'dress': return 'HD_Vay_DichVuKhac';
                    case 'family': return 'HD_Baby_GD';
                    case 'combo': return 'HD_Combo_Cuoi';
                    case 'service_2': return 'HD_Dich_Vu_TT2';
                    case 'service_3': return 'HD_Dich_Vu_TT3';
                    default: return 'HD_Dich_Vu';
                }
            }
            
            function setButtonsState(disabled, message = '') {
                document.getElementById('print-action').disabled = disabled;
                const pdfBtn = document.getElementById('download-pdf-action');
                const imgBtn = document.getElementById('download-img-action');
                pdfBtn.disabled = disabled;
                imgBtn.disabled = disabled;
                if(disabled) {
                    if (message.includes('PDF')) pdfBtn.textContent = 'Đang xử lý...';
                    if (message.includes('IMG')) imgBtn.textContent = 'Đang xử lý...';
                } else {
                    pdfBtn.innerHTML = '📄 Tải về PDF';
                    imgBtn.innerHTML = '🖼️ Tải Hình Ảnh';
                }
            }

            function downloadAsPdf() {
                const generateAndSavePdf = () => {
                    setButtonsState(true, 'PDF');
                    const element = document.getElementById('a4-page-content');
                    const originalShadow = element.style.boxShadow;
                    element.style.boxShadow = 'none';
                    const filename = `${getFileNamePrefix()}_${document.getElementById('contract-id').textContent.trim()}_${document.getElementById('customer-name').textContent.trim()}.pdf`;
                    
                    const opt = { 
                        margin:[10, 5, 5, 10], 
                        filename: filename, 
                        image: { type: 'jpeg', quality: 0.98 }, 
                        html2canvas: { 
                            scale: 2, 
                            useCORS: true, 
                            logging: false, 
                            letterRendering: true 
                        }, 
                        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' } 
                    };

                    html2pdf().from(element).set(opt).save().then(() => {
                        element.style.boxShadow = originalShadow;
                        setButtonsState(false);
                    }).catch(err => {
                        console.error("PDF generation failed:", err);
                        alert("Lỗi khi tạo PDF. Vui lòng thử lại.");
                        element.style.boxShadow = originalShadow;
                        setButtonsState(false);
                    });
                };
                renderContractTerms(currentContractType, generateAndSavePdf);
            }

            function downloadAsJpg() {
                const generateAndSaveJpg = () => {
                    setButtonsState(true, 'IMG');
                    const element = document.getElementById('a4-page-content');
                    const originalShadow = element.style.boxShadow;
                    element.style.boxShadow = 'none';
                    const filename = `${getFileNamePrefix()}_${document.getElementById('contract-id').textContent.trim()}_${document.getElementById('customer-name').textContent.trim()}.jpg`;
                    
                    const options = {
                        scale: 3,
                        useCORS: true,
                        logging: false,
                        letterRendering: true 
                    };

                    html2canvas(element, options).then(canvas => {
                        const link = document.createElement('a');
                        link.download = filename;
                        link.href = canvas.toDataURL('image/jpeg', 0.95);
                        link.click();
                    }).catch(err => {
                        console.error("Image generation failed:", err);
                        alert("Lỗi khi tạo hình ảnh. Vui lòng thử lại.");
                    }).finally(() => {
                        element.style.boxShadow = originalShadow;
                        setButtonsState(false);
                    });
                };
                renderContractTerms(currentContractType, generateAndSaveJpg);
            }
            
            function renderContractTerms(type, onReadyCallback) {
                currentContractType = type;
                
                const termsContainer = document.querySelector('.terms-section');
                const titleElement = document.getElementById('main-contract-title');
                const summaryContainer = document.getElementById('summary-section-container');
                const shootingInfoTable = document.querySelector('.shooting-info-table');
                const urlParams = new URLSearchParams(window.location.search);

                if (!termsContainer || !titleElement || !summaryContainer || !shootingInfoTable) return;

                if (type === 'dress') {
                    termsContainer.innerHTML = CONTRACT_TERMS_DRESS;
                    titleElement.textContent = 'HỢP ĐỒNG CUNG CẤP TRANG PHỤC, DỊCH VỤ KHÁC';
                    populateServiceTable('Trang phục', 'dress');
                    shootingInfoTable.style.display = 'none';
                    
                    const dressData = globalServiceData.filter(item => item.hang_muc === 'Phát sinh' || (item.hang_muc === 'Hợp đồng' && item.loai_dich_vu === 'Trang phục'));
                    const totalAmount = dressData.reduce((sum, item) => sum + (item.thanhtien || 0), 0);
                    const totalPromo = dressData.reduce((sum, item) => sum + (item.sotien_km || 0), 0);
                    const totalDue = totalAmount - totalPromo;

                    const summaryHTML = `
                        <table class="summary-table">
                            <tbody>
                                <tr><td>Tổng tiền:</td><td style="text-align:right;"><span class="dynamic-data">${totalAmount.toLocaleString('vi-VN')}</span></td></tr>
                                <tr><td>Khuyến mãi:</td><td style="text-align:right;"><span class="dynamic-data">${totalPromo.toLocaleString('vi-VN')}</span></td></tr>
                                <tr><td style="font-weight: 700;">Phải TT:</td><td style="text-align:right; font-weight: 700;"><span class="dynamic-data">${totalDue.toLocaleString('vi-VN')}</span></td></tr>
                                <tr><td colspan="2">(Bằng chữ: <span class="dynamic-data">${readNumberInVietnamese(totalDue)}</span>)</td></tr>
                            </tbody>
                        </table>`;
                    summaryContainer.innerHTML = summaryHTML;

                } else {
                    shootingInfoTable.style.display = 'table';
                    let summaryHTML = '';
                    
                    if (type === 'service_2' || type === 'service_3' || type === 'family' || type === 'combo') {
                        summaryHTML = `
                        <table class="summary-table">
                            <tbody>
                                <tr><td>Tổng tiền theo HĐ:</td><td style="text-align:right;"><span id="subtotal" class="dynamic-data"></span></td></tr>

                                <tr><td>Phát sinh:</td><td style="text-align:right;"><span id="additional-cost" class="dynamic-data"></span></td></tr>
                                <tr><td style="font-weight: 700;">Phải TT:</td><td style="text-align:right; font-weight: 700;"><span id="total-due" class="dynamic-data"></span></td></tr>
                                <tr><td>Đã TT:</td><td style="text-align:right;"><span id="amount-paid" class="dynamic-data"></span></td></tr>
                                <tr><td class="highlight-red">Còn Lại:</td><td style="text-align:right;" class="highlight-red"><span id="amount-remaining"></span></td></tr>
                                <tr><td colspan="2">(Bằng chữ: <span id="amount-in-words" class="dynamic-data"></span>)</td></tr>
                            </tbody>
                        </table>`;
                    }
                    
                    summaryContainer.innerHTML = summaryHTML;

                    const subtotalVal = parseFloat(urlParams.get('thanh_tien')?.replace(/,/g, '') || 0); 
                    const promotionVal = parseFloat(urlParams.get('khuyen_mai_tong')?.replace(/,/g, '') || 0); 
                    const addCostVal = parseFloat(urlParams.get('tong_phat_sinh')?.replace(/,/g, '') || 0); 
                    const totalDueVal = parseFloat(urlParams.get('phai_thanh_toan')?.replace(/,/g, '') || 0); 
                    const amountPaidVal = parseFloat(urlParams.get('da_thanh_toan')?.replace(/,/g, '') || 0); 
                    const remainingVal = parseFloat(urlParams.get('con_lai')?.replace(/,/g, '') || 0); 

                    const elSubtotal = document.getElementById('subtotal');
                    if(elSubtotal) elSubtotal.textContent = subtotalVal.toLocaleString('vi-VN');

                    const elPromotion = document.getElementById('total-promotion');
                    if(elPromotion) elPromotion.textContent = promotionVal.toLocaleString('vi-VN');

                    const elAddCost = document.getElementById('additional-cost');
                    if(elAddCost) elAddCost.textContent = addCostVal.toLocaleString('vi-VN');

                    const elTotalDue = document.getElementById('total-due');
                    if(elTotalDue) elTotalDue.textContent = totalDueVal.toLocaleString('vi-VN');

                    const elAmountPaid = document.getElementById('amount-paid');
                    if(elAmountPaid) elAmountPaid.textContent = amountPaidVal.toLocaleString('vi-VN');

                    const elRemaining = document.getElementById('amount-remaining');
                    if(elRemaining) elRemaining.textContent = remainingVal.toLocaleString('vi-VN');

                    const wordsEl = document.getElementById('amount-in-words');
                    if(wordsEl) wordsEl.textContent = readNumberInVietnamese(remainingVal); 

                    if (type === 'family') {
                        termsContainer.innerHTML = CONTRACT_TERMS_FAMILY;
                        titleElement.textContent = 'HỢP ĐỒNG BABY & GIA ĐÌNH';
                        populateServiceTable(null, 'family');

                        termsContainer.innerHTML = CONTRACT_TERMS_SERVICE_2;
                        titleElement.textContent = 'HỢP ĐỒNG CUNG CẤP DỊCH VỤ';
                        populateServiceTable(null, 'service_2');
                    } else if (type === 'service_3') {
                        termsContainer.innerHTML = CONTRACT_TERMS_SERVICE_3;
                        titleElement.textContent = 'HỢP ĐỒNG CUNG CẤP DỊCH VỤ';
                        populateServiceTable(null, 'service_3');

                        termsContainer.innerHTML = CONTRACT_TERMS_COMBO;
                        titleElement.textContent = 'HỢP ĐỒNG CUNG CẤP COMBO CƯỚI';

                const ten_ky_kh = urlParams.get('ten_ky_kh') || (urlParams.has('ma_hd') ? '' : 'Tên Khách Hàng Ký');

                if (document.getElementById('customer-signature-name')) document.getElementById('customer-signature-name').textContent = ten_ky_kh;
                if (document.getElementById('representative-name')) document.getElementById('representative-name').textContent = dai_dien;

                generatePaymentQRCode({

                     accountNo: accountNumber,
